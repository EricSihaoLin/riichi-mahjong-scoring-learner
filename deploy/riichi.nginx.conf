# /etc/nginx/sites-available/riichi
# Serves the static app on localhost only; cloudflared connects to it from the same machine.
server {
    listen 127.0.0.1:8080;
    server_name _;

    root /var/www/riichi;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(js|css)$ {
        add_header Cache-Control "public, max-age=3600";
    }
}
